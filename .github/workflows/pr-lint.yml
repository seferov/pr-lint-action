name: PR lint

on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./
      with:
        title-regex: '^(\[[a-z ]*\]|Bump) '
        title-regex-flags: 'g'
        error-message: 'Example error message'
